name: Demo

# Builds the examples as static web apps and publishes them to GitHub Pages so the
# docs can embed a live, interactive demo. Requires Pages to be enabled for the
# repo with "GitHub Actions" as the source (Settings → Pages).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demos
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:demos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demos

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
